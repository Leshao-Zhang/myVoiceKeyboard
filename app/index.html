<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src blob:; style-src 'self'; script-src 'self'">
  <title>语音键盘</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-skin="white">
  <main>
    <p id="glyph" class="idle">正在准备读音</p>
    <section id="custom" hidden>
      <div class="custom-head">
        <h1 id="custom-hint">点击虚拟键盘录制，敲真实键盘播放预览</h1>
        <div class="custom-tools">
          <p class="actions" id="config-actions">
            <button id="export-config" type="button">保存配置</button>
            <button id="import-config" type="button">导入配置</button>
            <button id="reset-config" type="button">恢复默认</button>
          </p>
          <p id="rec-bar" hidden>
            <span id="rec-label">正在录音</span>
            <button id="rec-save" type="button">保存</button>
            <button id="rec-cancel" type="button">取消</button>
          </p>
        </div>
      </div>
      <div id="board"></div>
    </section>
  </main>
  <footer>
    <p class="status"><span id="dot"></span><span id="status">正在准备</span></p>
    <label class="volume">音量
      <input id="volume" type="range" min="0" max="100" value="100">
    </label>
    <div class="theme">
      <button id="skin-menu" class="theme-trigger" type="button" data-skin="white" aria-haspopup="menu" aria-expanded="false" aria-controls="skin-list">
        <i class="swatch" aria-hidden="true"></i>
        <span>主题</span>
        <span id="skin-current">白色</span>
        <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 6.2 8 10 11.8 6.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <div id="skin-list" class="theme-list" role="menu" hidden>
        <button type="button" role="menuitemradio" data-skin="black" aria-checked="false"><i class="swatch" aria-hidden="true"></i>黑色</button>
        <button type="button" role="menuitemradio" data-skin="white" aria-checked="true"><i class="swatch" aria-hidden="true"></i>白色</button>
        <button type="button" role="menuitemradio" data-skin="pink" aria-checked="false"><i class="swatch" aria-hidden="true"></i>粉色</button>
        <button type="button" role="menuitemradio" data-skin="blue" aria-checked="false"><i class="swatch" aria-hidden="true"></i>蓝色</button>
      </div>
    </div>
    <p class="actions">
      <button id="custom-toggle" type="button" aria-pressed="false">自定义音频</button>
      <button id="toggle" type="button">暂停</button>
      <button id="access" type="button" hidden>辅助功能</button>
      <button id="input" type="button" hidden>输入监控</button>
    </p>
  </footer>
  <script src="keys.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
